<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Kypad",
    "alternateName": "Kypad",
    "url": "https://kypad.github.io/kp/"
  }
  </script>

  <title>Shared Clipboard</title>
  <meta name="description" content="Kypad is a technology website featuring tools, projects, tutorials and useful resources.">
  <meta name="robots" content="index, follow">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =====================================================
       SCREEN 1: KEY SELECTION
  ====================================================== -->
  <div id="keyScreen">
    <div class="key-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h1 style="margin: 0;">Shared Clipboard</h1>
        <button id="transferButton" class="transfer-btn" onclick="startFileTransfer()">
          Transfer Files ⚡
        </button>
      </div>

      <p>Enter your unique room key to open your shared clipboard.</p>

      <div class="key-input-row">
        <input
          id="keyInput"
          type="text"
          placeholder="Enter unique key"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          autofocus
        >

        <button id="enterButton" type="button">
          Enter
        </button>
      </div>

      <button id="generateKeyButton" type="button" class="generate-key-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M3 12h18"></path>
        </svg>
        Generate a secure random key
      </button>
    </div>
  </div>

  <!-- =====================================================
       SCREEN 2: REAL-TIME PAD
  ====================================================== -->
  <div id="padScreen">
    <!-- HEADER -->
    <div id="topBar">
      <button id="backButton" type="button" aria-label="Go back" title="Back">
        ←
      </button>

      <div id="keyDisplayArea">
        <div class="key-label">Key</div>
        <span id="padName"></span>
      </div>

      <span id="status">idle</span>

      <button id="updateButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>Update</span>
      </button>
    </div>

    <!-- EDITOR -->
    <div id="editorArea">
      <div id="paper">
        <textarea
          id="pad"
          spellcheck="false"
          placeholder="Start typing..."
        ></textarea>
      </div>
    </div>
  </div>

  <!-- Modular Encrypted Scripts -->
  <script src="js/vault-payload.js"></script>
  <script src="js/security.js"></script>
  <script src="js/clipboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
