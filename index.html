<!-- =====================================================
     SCREEN 1
====================================================== -->

<div id="keyScreen">

  <div class="key-card">


    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h1 style="margin: 0;">
      Shared Clipboard
    </h1>
    <button class="transfer-btn" onclick="startFileTransfer()">
      Transfer Files ⚡
    </button>
</div>


    <p>
      Enter your unique room key to open your shared clipboard.
    </p>


    <div class="key-input-row">


      <input
        id="keyInput"
        type="text"
        placeholder="Enter unique key"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      >


      <button
        id="enterButton"
        type="button"
      >
        Enter
      </button>


    </div>


    <button
      id="generateKeyButton"
      type="button"
      class="generate-key-link"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18M3 12h18"></path>
      </svg>
      Generate a secure random key
    </button>


  </div>

</div>



<!-- =====================================================
     SCREEN 2
====================================================== -->

<div id="padScreen">


  <!-- HEADER -->

  <div id="topBar">


    <button
      id="backButton"
      type="button"
      aria-label="Go back"
      title="Back"
    >
      ←
    </button>


    <div id="keyDisplayArea">


      <div class="key-label">
        Key
      </div>


      <span id="padName"></span>


    </div>


    <span id="status">
      idle
    </span>


    <button
      id="updateButton"
      type="button"
    >

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>

      <span>
        Update
      </span>


    </button>


  </div>



  <!-- EDITOR -->

  <div id="editorArea">


    <div id="paper">


      <textarea
        id="pad"
        spellcheck="false"
        placeholder="Start typing..."
      ></textarea>


    </div>


  </div>


</div>



<script>


function updateStatus(text) {

  status.textContent = text;
  
  let color = '#a1a1aa';
  
  if (text === 'ready' || text === 'saved') color = '#10b981'; // Green dot for ready
  else if (text === 'saving...') color = '#3b82f6';
  else if (text === 'unsaved') color = 'var(--primary)'; // Orange for unsaved
  else if (text.includes('error') || text === 'disconnected') color = '#ef4444';
  
  status.style.setProperty('--status-color', color);
  
}


function getApiHost() {

  return atob(

    "Y2hhdC1zZXJ2ZXIuc2t5YmFzZW9majIud29ya2Vycy5kZXY="

  );

}



function generateSecureKey(length = 22) {

  const charset =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  const bytes =
    new Uint8Array(length);

  crypto.getRandomValues(bytes);

  return Array.from(

    bytes,

    b => charset[b % charset.length]

  ).join("");

}




let ws;

let room;

let suppress = false;



const keyInput =
  document.getElementById("keyInput");


const keyScreen =
  document.getElementById("keyScreen");


const padScreen =
  document.getElementById("padScreen");


const pad =
  document.getElementById("pad");


const status =
  document.getElementById("status");


const padName =
  document.getElementById("padName");


const enterButton =
  document.getElementById("enterButton");


const updateButton =
  document.getElementById("updateButton");


const backButton =
  document.getElementById("backButton");


const generateKeyButton =
  document.getElementById("generateKeyButton");




async function openPad() {


  room =
    keyInput.value.trim();


  if (!room) {

    keyInput.focus();

    return;

  }


  /* Switch screens */

  keyScreen.style.display =
    "none";


  padScreen.style.display =
    "block";


  /* Display key */

  padName.textContent =
    room;


  updateStatus("loading...");


  const apiHost =
    getApiHost();




  try {


    const res =
      await fetch(

        `https://${apiHost}/history?room=${encodeURIComponent(room)}`

      );


    const history =
      await res.json();


    pad.value =

      history.length

        ? (
            history[
              history.length - 1
            ].text || ""
          )

        : "";


  }

  catch (error) {


    pad.value = "";


  }





  ws =
    new WebSocket(

      `wss://${apiHost}/?room=${encodeURIComponent(room)}`

    );



  ws.onopen =
    () => {


      updateStatus("ready");


    };



  ws.onmessage =
    e => {


      try {


        const m =
          JSON.parse(e.data);


        if (
          typeof m.text !== "string"
        ) {

          return;

        }


        suppress =
          true;


        pad.value =
          m.text;


        updateStatus("saved");


      }

      catch (error) {

        console.error(
          "Invalid WebSocket message:",
          error
        );

      }


    };



  ws.onerror =
    () => {


      updateStatus("connection error");


    };



  ws.onclose =
    () => {


      updateStatus("disconnected");


    };


  pad.focus();


}



/* =========================================================
   ENTER BUTTON
========================================================= */

enterButton.addEventListener(

  "click",

  openPad

);



/* =========================================================
   GENERATE KEY BUTTON
========================================================= */

generateKeyButton.addEventListener(

  "click",

  () => {


    keyInput.value =
      generateSecureKey();


    keyInput.focus();


  }

);



/* =========================================================
   PRESS ENTER TO OPEN
========================================================= */

keyInput.addEventListener(

  "keydown",

  e => {


    if (
      e.key === "Enter"
    ) {


      e.preventDefault();


      openPad();


    }


  }

);



/* =========================================================
   DETECT CHANGES
========================================================= */

pad.addEventListener(

  "input",

  () => {


    if (suppress) {


      suppress =
        false;


      return;


    }


    updateStatus("unsaved");


  }

);



/* =========================================================
   UPDATE / SAVE
========================================================= */

updateButton.addEventListener(

  "click",

  () => {


    if (
      !ws ||
      ws.readyState !== WebSocket.OPEN
    ) {


      updateStatus("not connected");


      return;


    }


    updateStatus("saving...");


    ws.send(

      JSON.stringify({

        user:
          "__pad__",

        text:
          pad.value,

        time:
          Date.now()

      })

    );


    updateStatus("saved");


  }

);



/* =========================================================
   BACK BUTTON
========================================================= */

backButton.addEventListener(

  "click",

  () => {


    if (ws) {


      ws.close();


      ws =
        null;


    }


    padScreen.style.display =
      "none";


    keyScreen.style.display =
      "flex";


    updateStatus("idle");


    keyInput.focus();


  }

);

</script>
